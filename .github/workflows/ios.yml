name: iOS build
# Compiles the iOS wrapper for the iPhone simulator, to prove the project builds.
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: xcodebuild -version && swift --version
      - name: Schemes
        working-directory: ios/PowderKeg.swiftpm
        run: xcodebuild -list
      - name: Build for the iOS simulator
        working-directory: ios/PowderKeg.swiftpm
        run: |
          set -o pipefail
          SCHEME=$(xcodebuild -list -json | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('workspace') or d.get('project'))['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
      - name: What was built
        working-directory: ios/PowderKeg.swiftpm
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name '*.app' | head -1)
          echo "App: $APP"
          find "$APP" -name 'index.html' -exec ls -la {} \;
          test -n "$(find "$APP" -name 'index.html')"
      - name: Build the standard Xcode project for the iOS simulator
        working-directory: ios/PowderKeg
        run: |
          set -o pipefail
          xcodebuild -list -project PowderKeg.xcodeproj
          xcodebuild -project PowderKeg.xcodeproj -target PowderKeg -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/out" build 2>&1 | tail -40
      - name: The Xcode project's app contains the game and its icon
        working-directory: ios/PowderKeg
        run: |
          APP=$(find out -maxdepth 3 -name 'PowderKeg.app' | head -1)
          echo "App: $APP"; ls -la "$APP"
          test -f "$APP/index.html"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
