<style>

:root{--paper:#F1E9D6;--paper2:#E6DBC2;--card:#FBF6E9;--ink:#2A241C;--muted:#6B6050;--line:#C9BA98;--navy:#2D4A7A;--red:#9C3328;--gold:#C89B3C;--good:#2E7D3A;--bad:#B02A20;--warn:#9A5B00;

html,body{height:100%;margin:0;background:#6F8FA3;color:var(--ink);overflow:hidden;overscroll-behavior:none}

*{box-sizing:border-box}

h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
p{margin:5px 0}small{font-size:13px}
.sub{color:var(--muted);font-size:14px}.bad{color:var(--bad)}.yes{color:var(--good)}
.link{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline}
.eyebrow{margin:0;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
#hud{position:absolute;inset:0;pointer-events:none}#hud>*{pointer-events:auto}

#top .who{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-family:var(--display);font-size:19px}#top .who canvas{display:block}
#top .date{font-family:var(--display);font-size:19px;margin-right:auto;white-space:nowrap;color:var(--red)}

.tens{display:flex;align-items:center;gap:5px}.tens .bar{width:90px;height:10px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;overflow:hidden;display:block}.tens .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red))}

#side button small{font-size:11px;font-weight:700}#side button.on{border-color:var(--navy);background:#fff}

.chron{min-width:0}.chron b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--red)}.chron p{margin:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chron p+p{color:var(--muted)}.chron i{font-style:normal;color:var(--muted);margin-right:6px;font-size:13px}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.panel button.danger{background:var(--red)}
.panel button.link{background:none;color:var(--navy);padding:0;font-weight:400}
.panel button small,.card button small{display:block;font-weight:400;font-size:12.5px;opacity:.9}
#info{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:66px;width:min(310px,84vw);max-height:calc(100% - 160px);overflow:auto;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3);touch-action:pan-y;font-size:15px}

.x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line)!important;background:var(--paper2)!important;color:var(--ink)!important;padding:0!important;font-size:16px}
.battle{background:#FBE5DC;border:1px solid #D9A090;border-radius:8px;padding:6px 8px}
.dlist{display:grid;gap:2px;margin:6px 0;max-height:260px;overflow:auto}

.panel{overflow:auto;padding:14px 16px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel h2{font-size:28px;margin-right:36px}.panel h3{font-size:20px;margin-top:14px;margin-bottom:4px}.panel h3 small{font-family:var(--body);color:var(--muted)}

.laws,.acts{display:grid;gap:6px}.laws button{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left}.laws button.on{border-color:var(--navy);background:#fff;box-shadow:0 0 0 1px var(--navy)}.laws button small{color:var(--muted)}
.acts button{text-align:left}
.nlist{display:grid;gap:4px;margin-top:8px}.nlist button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:4px 10px;font-weight:400}.nlist small{color:var(--muted);opacity:1}
.nlist .op{font-variant-numeric:tabular-nums;white-space:nowrap}.ic{display:inline-grid;place-items:center}.ic canvas{display:block}
.dhead{display:flex;gap:12px;align-items:center;margin:8px 0}
.tpl{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;margin:8px 0}.tpl p{margin:2px 0;font-size:14.5px}.tpl small{color:var(--muted)}.tpl button small{color:inherit}
.stats{display:block;font-size:13.5px;color:var(--muted)}.stats b{color:var(--ink)}

.menu-in{background:var(--paper);border:3px double #9C8A62;border-radius:8px;max-width:720px;width:100%;padding:24px 28px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}

.menu-in button.big{padding:12px 18px;font-size:19px}.big small{display:block;font-weight:400;opacity:.85}
.mlist{display:grid;gap:8px}.mcard{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
.mcard:hover,.minors button:hover{border-color:var(--navy)}.mbody{display:grid}.mbody b{font-family:var(--display);font-weight:400;font-size:22px}.mbody span{font-size:15px;color:var(--muted)}
.minors{display:flex;flex-wrap:wrap;gap:6px}.minors button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px 3px 6px;font-size:14.5px}
.seedrow{display:flex;align-items:center;gap:8px;font-weight:700}.seedrow .txt{width:120px}.seedrow button{border-radius:8px;padding:6px 12px}
.fine{font-size:14px;color:var(--muted);margin:0}

  #panel{left:8px;width:calc(100vw - 16px);bottom:140px;top:92px}#info{top:92px;max-height:42%}.selbar{max-width:150px}.tens .bar{width:50px}#bottom{min-height:70px}}

</style>

E.ott_choice={tag:'OTT',when:S=>war(S,'GER','RUS')&&S.wars['GER|RUS']&&S.day-S.wars['GER|RUS'].day>75&&!G.inWar(S,'OTT'),pic:'🌙',title:'Two German cruisers',

const ev=(id,o)=>{E[id]=Object.assign({scen:'1936'},o)};
function regimeFalls(S,how){if(!reg(S))return;set(S,'regime_fell');G.rename(S,'GER',{name:'German Republic',adj:'German',flag:'REP',head:'Chancellor Goerdeler',regime:false,dials:{amb:.3,cau:.7,gru:.5}});
  S.nat.GER.stab=45;G.tension(S,-20);for(const o of['ENG','FRA','POL','CZE'])if(!S.nat[o].dead)G.op(S,o,'GER',30);
  G.news(S,how+' The dictatorship in Germany is over. A provisional government of generals and civil servants promises elections and an end to the camps.','story');
  const partners=G.sideOf(S,'GER').filter(x=>x!=='GER'&&x!=='ITA');if(G.inWar(S,'GER')){sue(S,'GER');for(const x of partners)if(alive(S,x)&&G.inWar(S,x))later(S,4,'axis_minor',x)}}
function rhineDone(S){set(S,'rhine_done');bump(S,'GER','stab',6);bump(S,'GER','ws',8);bump(S,'FRA','ws',-3);G.tension(S,6);G.op(S,'BEL','FRA',-15);S.guar=S.guar.filter(g=>!(g[0]==='FRA'&&g[1]==='BEL'));
  for(const k of['cologne','ruhr'])if(own(S,k)==='GER')G.spawn(S,'GER',G.KEY[k],0,2,.4);G.index(S);
  G.news(S,'German troops stay in the Rhineland. France protests to the League of Nations; Belgium returns to neutrality.','dip')}

ev('rhineland_fra',{pic:'🌉',title:'German troops on the Rhine',

ev('rhineland_eng',{pic:'🎩',title:'France asks for support',
 text:'Paris will march into the Rhineland if Britain marches too. The Cabinet\'s feeling is that the Germans are only walking into their own back garden, and that the public would not understand a war to stop them.',

/* rearmament: the regimes arm in peacetime whatever anyone chooses */
function grant(S,tg,id){const N=S.nat[tg],T=D.TECH.find(x=>x.id===id);if(!T||N.tech.includes(id))return;N.research=N.research.filter(r=>r.id!==id);N.tech.push(id);for(const k in T.fx)N.mod[k]=(N.mod[k]||0)+T.fx[k];G.touch(S,tg)}
function rearm(id,date,nInf,nArm,fac,tech,text,more){ev(id,{tag:'GER',when:S=>S.day>=date&&reg(S)&&alive(S,'GER'),pic:'🏭',title:'German rearmament',text,opts:S=>[{label:'Continue.',fx(S){raise(S,'GER',nArm,2);raise(S,'GER',nInf,0);S.nat.GER.builtMil+=fac;for(const x of tech)grant(S,'GER',x);if(more)more(S);G.tension(S,2);G.news(S,text,'dip')}}]})}

/* =====================================================================
   The campaigns beyond the central front, 1940–1944
   Some are fought on the map. The desert and the Far East lie off it: divisions sent there leave the map and are counted in S.off,
   and come back (or do not) when the theatre is decided.
   ===================================================================== */
const off=S=>S.off||(S.off={}),offN=(S,k)=>(S.off&&S.off[k])||0;
/* results that nobody chooses are drawn by a bystander, weighted by what the powers have done */
const umpire=S=>['SWI','SWE','POR','IRE','SPA','OTT'].find(t=>t!==S.player&&!S.nat[t].dead)||'GER';
const roll=(S,days,id,data)=>later(S,days,id,umpire(S),data);
const clampW=(v,a,b)=>Math.round(Math.max(a,Math.min(b,v)));
/* n infantry divisions leave the map from the home country, never the last four; returns how many went */
function ship(S,tg,n,key){const N=S.nat[tg];if(N.dead||N.capit||n<=0)return 0;
  const home=S.divs.filter(d=>d.o===tg&&d.t===0&&!d.ret&&(d.b===null||d.b===undefined)&&!S.battles[d.p]&&S.prov[d.p].owner===tg).sort((a,b)=>b.str-a.str||a.id-b.id);
  const k=Math.max(0,Math.min(n,home.length-4));for(let i=0;i<k;i++)S.divs.splice(S.divs.indexOf(home[i]),1);
  if(k){off(S)[key]=offN(S,key)+k;G.index(S)}return k}
function unship(S,tg,key,share,str,name){const n=Math.round(offN(S,key)*(share===undefined?1:share));if(S.off)S.off[key]=0;if(n>0)raise(S,tg,n,0,name,str||.8);return n}
/* a country overrun in days: it is at war with the invader and has capitulated, and stays occupied until a peace frees it */
function occupy(S,by,tg){const N=S.nat[tg];if(N.dead||N.capit||G.friendly(S,by,tg))return false;G.setWar(S,by,tg,by);G.capitulate(S,tg);G.spread(S);return true}

  for(const[k,n]of[['clermont',2],['lyon',2],['marseille',2],['algiers',2],['tunis',1],['damascus',1]])if(S.prov[G.KEY[k]].ctrl==='FRA')G.spawn(S,'FRA',G.KEY[k],0,n,.3,'# Division of the Armistice Army',.6);

const HELP='<h2>How to play</h2><p>You run one nation. The clock is paused until you press ▶. Telegrams stop it again whenever a decision is yours.</p>'+
 '<h3>Start small</h3><p>You do not have to manage everything. Ministers run plans, industry, research and the fleet unless you take an area over under <b>Ministers</b>. To begin with, answer the telegrams, watch the map, and command your divisions. You can even hand the war to the generals.</p>'+
 '<h3>The map</h3><p>Click a province to see it and to select your divisions there. With divisions selected, click another province to send them. Right-click does the same. Shift-click adds a second stack. The bar under each counter shows strength and organisation together.</p>'+
 '<h3>Fighting</h3><p>Moving into a province held by the enemy starts a battle. A battle line is 80 wide, about three divisions, plus 40 for each extra direction you attack from, so attack from several provinces at once. Defenders who are dug in or behind forts take very little harm, and attackers without breakthrough bleed. Heavy artillery, and later tanks, are how a line is broken. Cut a province off from its capital and the troops in it starve.</p>'+
 '<h3>Sea and air</h3><p>Battle squadrons are stationed in six seas. Move them where your crossings and ports need them: an enemy with the stronger fleet in a sea closes it to your troops and can blockade you. Submarines cut the enemy\'s output unless escorted convoys stop them. Fighter and bomber wings are formed from aircraft you build, based in a province, and reach battles nearby.</p>'+
 '<h3>Armies</h3><p>Select divisions, open Army and form them into an army. Set it to Hold, Advance or Assault and it runs its own front under its general. Leave it on Manual to give every order yourself.</p>'+
 '<h3>The country</h3><p><b>Plans</b> shape what kind of state you become, one at a time. <b>Industry</b> splits military factories between weapons and uses civilian factories to build. <b>Research</b> runs two or three teams. <b>State</b> holds your laws, and your aims.</p>'+
 '<h3>Other nations</h3><p>A ball\'s eyes show what it thinks of you. Open Diplomacy to improve relations, guarantee a neighbour, propose an alliance, demand a claim, or prepare a case for war. Every nation has its own temperament and remembers a harsh peace.</p>'+
 '<h3>Winning</h3><p>There is no single way to win. Your aims are listed under State and are judged on the end date, when your timeline is set beside the real one. Stability and war support matter as much as armies: a nation whose home front collapses must ask for terms.</p>';

   case'mgr':G.cmd.minister(S,p,x,y==='1');refresh();break;
   case'armyGen':say(G.cmd.armyGeneral(S,p,+x));break;
   case'sq':say(G.cmd.squadron(S,p,x,+y));break;case'wing':say(G.cmd.wing(S,p,x));break;case'rebase':say(G.cmd.rebase(S,p,+x,selProv));break;
   case'sound':sound=!sound;try{localStorage.setItem('powderkeg.sound',sound?'1':'0')}catch(e){}if(sound)beep('done');refresh();break;
   case'reckon':endOpen=true;panel=null;refresh();break;
   case'endKeep':endOpen=false;refresh();break;
   case'carry':{const n=G.carry(S);if(n){endOpen=false;begin(n);saveGame();toast('It is 1936. The world you made is still here.')}break}
   case'scen':menuScen=x;menu();break;
   case'plan':say(G.cmd.plan(S,p,x));break;case'cancelPlan':G.cmd.cancelPlan(S,p);refresh();break;
   case'armyNew':say(G.cmd.armyNew(S,p,[...sel]));break;
   case'armyAdd':G.cmd.armyAdd(S,p,+x,[...sel]);refresh();break;
   case'armySet':G.cmd.armySet(S,p,+x,'stance',+y);refresh();break;
   case'armyFoe':{const a=(me().armies||[]).find(v=>v.id===+x),f=[null].concat(G.activeEnemies(S,p));if(a){a.foe=f[(f.indexOf(a.foe)+1)%f.length]||null}refresh();break}
   case'armySel':sel.clear();selProv=-1;for(const d of S.divs)if(d.o===p&&d.army===+x)sel.add(d.id);refresh();break;
   case'armyDel':G.cmd.armyDisband(S,p,+x);refresh();break;
   case'save':toast(saveGame()?'Saved.':'This browser would not store the save.');break;
   case'quit':saveGame();S=null;speed=0;panel=null;endOpen=false;sel.clear();selProv=-1;$('hud').hidden=true;$('modal').hidden=true;menu();dirty=true;break;
   case'seed':{const el=$('seed');if(el)el.value=1000+Math.floor(Math.random()*9000);break}
  }}
function keepName(){const el=$('tplname');if(el&&edit)edit.tpl.name=el.value.trim()||'Division'}

/* ---------- saving ---------- */
function saveGame(){if(!S)return false;try{localStorage.setItem(SAVE_KEY,G.save(S));return true}catch(e){return false}}
function savedInfo(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return null;const o=JSON.parse(s);if(o.v!==D.VERSION||!o.nat[o.player])return null;return{player:o.player,day:o.day,name:o.nat[o.player].name||(o.natOv&&o.natOv[o.player]&&o.natOv[o.player].name)||D.BASE_NATIONS[o.player].name}}catch(e){return null}}
function loadGame(){try{const o=G.load(localStorage.getItem(SAVE_KEY));if(o)begin(o);else toast('That save could not be read.')}catch(e){toast('That save could not be read.')}}

/* ---------- menu ---------- */
const BLURB={GER:'The strongest army in Europe, with enemies on both sides.',AUS:'Eleven nations under one crown, and a score to settle with Serbia.',RUS:'Endless manpower, thin industry, and a throne less secure than it looks.',FRA:'Forty-three years of waiting for Alsace-Lorraine.',
 ENG:'The greatest fleet in the world and a very small army.',ITA:'Allied to its rival and courted by everyone.',OTT:'An old empire deciding which friend will cost it least.'};
function menu(){const m=$('menu');m.hidden=false;const sv=savedInfo(),scens=Object.keys(D.SCEN).filter(k=>k!=='carry');if(!D.SCEN[menuScen])menuScen='1914';const SC=D.SCEN[menuScen],pre=G.newGame('XXX',1,menuScen),live=G.TAGS.filter(t=>!pre.nat[t].dead),
  majors=live.filter(t=>D.NATIONS[t].major),minors=live.filter(t=>!D.NATIONS[t].major&&t!=='LUX'&&t!=='PER'&&t!=='DZG'),card=t=>D.NATIONS[t].regime?'<div class="mcard off"><span class="ic" data-ball="'+t+'"></span><span class="mbody"><b>'+D.NATIONS[t].name+'</b><span>Run by the computer in this scenario.</span></span></div>':'<button class="mcard" data-act="new:'+t+'"><span class="ic" data-ball="'+t+'"></span><span class="mbody"><b>'+D.NATIONS[t].name+'</b><span>'+esc((SC.blurbs&&SC.blurbs[t])||(menuScen==='1914'&&BLURB[t])||'')+'</span></span></button>';
  m.innerHTML='<div class="menu-in"><p class="eyebrow">Europe, '+G.date(SC.start).str+'</p><h1>Powder Keg</h1>'+(scens.length>1?'<div class="seg">'+scens.map(k=>'<button data-act="scen:'+k+'" class="'+(k===menuScen?'on':'')+'">'+esc(D.SCEN[k].name)+'</button>').join('')+'</div>':'')+'<p class="lede">'+esc(SC.blurb||'')+' Choose a nation and decide.</p>'+
   (sv?'<button class="big" data-act="continue">Continue your saved game<small>'+esc(sv.name)+' · '+G.date(sv.day).str+'</small></button>':'')+
   '<h3>The great powers</h3><div class="mlist">'+majors.map(card).join('')+'</div>'+
   '<h3>The smaller states</h3><div class="minors">'+minors.map(t=>'<button data-act="new:'+t+'"><span class="ic" data-ball="'+t+'"></span>'+D.NATIONS[t].name+'</button>').join('')+'</div>'+
   '<label class="seedrow" for="seed">Fate seed <input id="seed" class="txt" inputmode="numeric" maxlength="9" value="'+(1000+Math.floor(Math.random()*9000))+'"><button class="ghost" data-act="seed">Shuffle</button></label>'+
   '<p class="fine">The seed shuffles the Fate cards and the choices other nations make. Play the same seed with the same decisions and history repeats itself. Change one decision and it will not.</p></div>';
  m.querySelectorAll('[data-ball]').forEach(e=>e.appendChild(A.icon(fid(e.dataset.ball),e.parentNode.classList.contains('mcard')?48:26,'neutral')))}
function startGame(tag){const el=$('seed'),seed=Math.abs(parseInt(el&&el.value,10))||1914;begin(G.newGame(tag,seed,menuScen));let first=false;try{first=!localStorage.getItem('powderkeg.seenHelp');localStorage.setItem('powderkeg.seenHelp','1')}catch(e){}if(first){panel='help';refresh()}}
function begin(state){S=state;G.applyScen(S);G.index(S);G.supply(S);endOpen=false;seenWar=Object.keys(S.wars).filter(k=>k.split('|').includes(S.player)).length;seenPend=S.pending.length;$('menu').hidden=true;$('hud').hidden=false;speed=0;panel=null;sel.clear();selProv=-1;dipTag=null;edit=null;recP=-1;resize();const cap=me().cap;centreOn(cap>=0?cap:0,Math.max(minZ(),Math.min(1.5,vw/900)));refresh();
  if(S.day===S.day0)toast('Paused. Your ministers run industry, research, plans and the fleet. You decide the telegrams, diplomacy and the army. Press ▶ when ready.')}

/* ---------- main loop ---------- */
function frame(t){const dt=Math.min(250,t-last);last=t;
  if(S&&speed>0&&!S.pending.length){acc+=dt;let n=0;while(acc>=SPEED[speed]&&n<6){acc-=SPEED[speed];n++;if(!G.tick(S))break;if(G.date(S.day).d===1)saveGame();if(S.pending.length)break}
    if(n){for(const id of[...sel])if(!G.div(S,id))sel.delete(id);refresh()}}else acc=0;
  if(dirty)draw();requestAnimationFrame(frame)}
function init(){cv=$('cv');cx=cv.getContext('2d');
  document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled){e.preventDefault();beep('click');act(b.dataset.act)}});
  document.addEventListener('change',e=>{const t=e.target;if(t.dataset.div){const id=+t.dataset.div;if(t.checked)sel.add(id);else sel.delete(id);bottom();dirty=true}
    if(t.dataset.sup&&edit){keepName();const s=t.dataset.sup,a=edit.tpl.sup=edit.tpl.sup||[];if(t.checked){if(!a.includes(s))a.push(s)}else edit.tpl.sup=a.filter(x=>x!==s);refresh()}});
  cv.addEventListener('pointerdown',onDown);cv.addEventListener('pointermove',onMove);cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);drag=null});
  cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*.0015))},{passive:false});cv.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('keydown',e=>{if(!S||e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();speed=speed?0:1;refresh()}else if(e.key>='1'&&e.key<='3'){speed=+e.key;refresh()}else if(e.key==='Escape'){if(panel){panel=null;edit=null}else{sel.clear();selProv=-1}refresh()}});
  try{sound=localStorage.getItem('powderkeg.sound')!=='0'}catch(e){}
  window.addEventListener('resize',resize);resize();menu();requestAnimationFrame(frame);
  const hot=window.claude&&window.claude.hot;if(hot&&hot.snapshot)hot.snapshot(()=>(S?{save:G.save(S)}:{}));
  if(hot&&hot.data&&hot.data.save){try{const o=G.load(hot.data.save);if(o)begin(o)}catch(e){}}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true})}
PK.UI={init,state:()=>S,act,centreOn,click:(key,right)=>click(G.KEY[key]===undefined?-1:G.KEY[key],right),setSpeed:v=>{speed=v}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})(globalThis.PK=globalThis.PK||{});

</script>
